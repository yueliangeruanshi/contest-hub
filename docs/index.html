<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Contest Hub · Demo（Codeforces / AtCoder / 洛谷 / 代码源 比赛一览）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-glow"></div>

<div class="app">
  <header class="hd">
    <div class="brand">
      <div class="logo">
        <span class="dot cf"></span><span class="dot ac"></span><span class="dot lg"></span><span class="dot dmy"></span>
      </div>
      <div class="title-wrap">
        <h1>Contest Hub <span class="demo-tag">Demo</span></h1>
        <p class="sub">Codeforces · AtCoder · 洛谷 · 代码源 比赛集中看板</p>
      </div>
    </div>
    <div class="hd-right">
      <div class="updated">数据快照 · <span id="updated">—</span></div>
      <a class="btn-refresh" href="https://github.com/yueliangeruanshi/contest-hub" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
          <path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7 0-.7 0-.7 1.2 0 1.9 1.2 1.9 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.2-3.1-.1-.4-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.2a4.5 4.5 0 0 1 1.2 3.1c0 4.7-2.8 5.7-5.5 6 .4.4.7 1 .7 2v3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/>
        </svg>
        <span>源码</span>
      </a>
    </div>
  </header>

  <div class="notice">
    <strong>静态演示版</strong> · 数据为由 GitHub Actions 定时抓取的快照，<b>每 6 小时自动更新</b>，倒计时仍然实时。
    想要实时拉取数据，请把仓库 clone 到本地运行 <code>python server.py</code>。
  </div>

  <section class="stats" id="stats"></section>

  <section class="filters">
    <div class="chips" id="platformChips"></div>
    <div class="right-tools">
      <div class="search">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <input id="search" type="text" placeholder="搜索比赛名称 / 编号…" autocomplete="off">
      </div>
      <div class="tabs" id="statusTabs"></div>
    </div>
  </section>

  <main id="list" class="list"></main>

  <footer class="ft">
    <span id="srcStatus"></span>
    <span class="tip">数据源：Codeforces API · AtCoder 官方列表 / AtCoder Problems · 洛谷比赛列表页</span>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
